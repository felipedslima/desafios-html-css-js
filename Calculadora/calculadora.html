<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculadora.css">
    <title>Document</title>
</head>

<body>
    <div class="calculadora">
        <ul class="lista-historico"></ul>
        <div class="historico"></div>
        <div class="display">0</div>
        <div class="teclado">
            <button class="botoes">AC</button><button class="botoes">+/-</button><button
                class="botoes">%</button><button class="botoes1">÷</button>
            <button>7</button><button>8</button><button>9</button><button class="botoes1">x</button>
            <button>4</button><button>5</button><button>6</button><button class="botoes1">-</button>
            <button>1</button><button>2</button><button>3</button><button class="botoes1">+</button>
            <button style="font-size: 2.7rem">🖩</button><button>0</button><button>,</button><button
                class="botoes1">=</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="calculadora.js"></script>
</body>

</html>
